# Site Settings
# `title` is what jekyll-seo-tag puts in every page title and share
# preview, so it matches the name the site actually uses in its logo and
# footer rather than the old "Hasan's Knowledge Hub".
title: Noema
tagline: A Digital Knowledge Garden
description: A personal knowledge repository exploring various domains of knowledge
baseurl: "" # Leave empty if your site is at root level
url: "https://hhshanto.github.io"
# Also the byline on every post, via _includes/article-head.html, and the
# author jekyll-seo-tag puts in the page metadata. It said "Hasan"; the home
# page names him in full, and the two should not disagree.
author: Mohammad Hasan

# Used to build the "Edit on GitHub" link in a post's rail. jekyll-github-metadata
# would supply site.github.repository_url, but it is not in the plugin list, so
# the two values are written down here. `edit_branch` is where an edit should
# land, which is main — not whatever branch happens to be building.
repository: hhshanto/hhshanto.github.io
edit_branch: main

# Publisher logo for the structured-data block. The link-preview image is
# set per page further down under `defaults`, because jekyll-seo-tag reads
# og:image from `page.image` and ignores a site-level `image`.
logo: /assets/images/logo.png

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Collections
#
# All five live under _content/ rather than at the repo root, which kept ten
# directories there — five collections plus five more that existed only to
# hold a single index page. Those index pages are now pages/*.md carrying an
# explicit `permalink:`, so every URL is unchanged. Jekyll 3.7+ only; we are
# on 3.10 via github-pages.
collections_dir: _content

collections:
  natural-sciences:
    output: true
    permalink: /natural-sciences/:path/
  social-sciences:
    output: true
    permalink: /social-sciences/:path/
  arts-literature:
    output: true
    permalink: /arts-literature/:path/
  reflections:
    output: true
    permalink: /reflections/:path/
  contemporary:
    output: true
    permalink: /contemporary/:path/

# Defaults for collections
# Every collection gets layout: post so a document that omits the front
# matter key still renders inside the site chrome instead of as raw text.
defaults:
  # Fallback link-preview image for every page. Any page or post can
  # override it by setting its own `image` in front matter.
  - scope:
      path: ""
    values:
      image: /assets/images/logo.png
  - scope:
      path: ""
      type: "reflections"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "natural-sciences"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "social-sciences"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "arts-literature"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "contemporary"
    values:
      layout: "post"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  # The files on disk are lowercase. GitHub Pages builds on a
  # case-sensitive filesystem, so the capitalised entries above never
  # matched there and both were being published with the site.
  - gemfile
  - gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - README.md
  - dir.py
  - 3d-portfolio
  # Redesign working files. Both are repo documentation, not site content —
  # without these, Jekyll copies the mockups, the source zip and the agent
  # instructions straight to the public site.
  - design
  - CLAUDE.md
  # Source masters for the generated portrait variants. Kept in the repo
  # so the images can be regenerated, but nothing links to them, so there
  # is no reason to publish 575 KB of unreachable photos.
  - assets/images/profile.jpg
  - assets/images/profile2.jpg

# Social Media (you can add or remove as needed)
social:
  github: hhshanto
  # twitter: yourusername
  # linkedin: yourusername
  # email: your.email@example.com

# Analytics (uncomment if you want to add Google Analytics)
# google_analytics: UA-XXXXXXXX-X

# Compression settings
sass:
  style: compressed

# Timezone
timezone: Asia/Dhaka