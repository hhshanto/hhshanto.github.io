    url: https://linkedin.com/in/mhasan-shanto/
  - label: GitHub
    url: https://github.com/hhshanto
  - label: Email
    url: mailto:hasanibnesaleh@gmail.com

# The curriculum band, in two lists rather than one. Blended together, a degree
# and a job read as the same kind of row and neither stands out; separated, the
# education is legible at a glance, which is the point of putting it this high
# on the page.
#
# `period` sits in a narrow mono rail beside the rest, so keep it short — it is
# set in mono and will not wrap gracefully. `place` is the line under `role`.
experience:
  - period: Now
    role: Research Data Scientist
    place: KPMG Global Solution Group
  - period: 23–24
    role: Research Assistant
    place: University of Potsdam

education:
