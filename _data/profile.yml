# Everything the home page says about its author.
#
# Kept as data rather than markup so the page can be reworded without opening a
# template. Every value here is lifted from the previous home page and about
# section — none of it is new copy. The handoff's own hero text is placeholder
# and is not used.

# The mono line above the headline, in three parts rather than one string: the
# name is set apart from the other two, at full contrast and a step larger, so
# it reads as a name rather than as another label.
name: Mohammad Hasan
role: Data Scientist
location: Potsdam, DE

# The headline runs over two lines, the second in italic. This is the site's
# tagline rather than a name: the masthead already says NOEMA, the portrait and
# CV beside it say who wrote it, and inventing a slogan for someone is not the
# redesign's job. Change these two lines to lead with a name instead.
headline: A digital
headline_italic: knowledge garden

intro: >
  Insights from data science to philosophy, technology to arts. Based in
  Potsdam, Germany, exploring the intersection of technology and knowledge
  sharing — and writing it down as it goes.

